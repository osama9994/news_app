name: Flutter Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "NEWS_API_KEY=$NEWS_API_KEY" > .env

      - name: Create Firebase Options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-simulator:
    name: Build & Test iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "NEWS_API_KEY=$NEWS_API_KEY" > .env

      - name: Create Firebase Options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod deintegrate
          pod install --repo-update
          cd ..

      - name: Show Available iOS Simulators
        run: |
          xcrun simctl list devices available

      - name: Build iOS Simulator
        run: flutter build ios --debug --simulator

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | \
            grep -E 'iPhone.*\(.*\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi

          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install App on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          echo "Installing app on simulator: $DEVICE_ID"

          xcrun simctl install "$DEVICE_ID" \
            build/ios/iphonesimulator/Runner.app

      - name: Launch App on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          xcrun simctl launch "$DEVICE_ID" com.example.newsApp

      - name: Verify App Process
        run: |
          sleep 10

          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          echo "Checking running applications..."

          xcrun simctl spawn "$DEVICE_ID" \
            launchctl list | grep com.example.newsApp

      - name: Shutdown iOS Simulator
        if: always()
        run: |
          xcrun simctl shutdown all || true

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-app-ios-simulator
          path: build/ios/iphonesimulator/Runner.app