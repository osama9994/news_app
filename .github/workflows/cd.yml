name: Flutter Continuous Delivery (CD)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    name: Build & Distribute Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "NEWS_API_KEY=$NEWS_API_KEY" > .env

      - name: Create Firebase Options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-key.json

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-key.json
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ secrets.FIREBASE_NEWS_APP_ID }} \
            --groups developers \
            --release-notes "New release from GitHub Actions for News App"

      - name: Remove Firebase Key
        if: always()
        run: rm -f firebase-key.json

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-app-android-release
          path: build/app/outputs/flutter-apk/app-release.apk


  ios-release:
    name: Build iOS Simulator Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          echo "NEWS_API_KEY=$NEWS_API_KEY" > .env

      - name: Create Firebase Options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod deintegrate
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator
        run: flutter build ios --debug --simulator

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | \
            grep -E 'iPhone.*\(.*\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi

          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install App on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" \
            build/ios/iphonesimulator/Runner.app

      - name: Launch App on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          xcrun simctl launch "$DEVICE_ID" com.example.newsApp

      - name: Verify App Process
        run: |
          sleep 10

          DEVICE_ID=$(xcrun simctl list devices booted | \
            grep -E 'iPhone.*\(Booted\)' | \
            head -1 | \
            grep -oE '[0-9A-F-]{36}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No booted iPhone simulator found."
            exit 1
          fi

          xcrun simctl spawn "$DEVICE_ID" \
            launchctl list | grep com.example.newsApp

      - name: Shutdown iOS Simulator
        if: always()
        run: |
          xcrun simctl shutdown all || true

      - name: Zip iOS Simulator App
        run: |
          cd build/ios/iphonesimulator
          zip -r news-app-ios-simulator.zip Runner.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-app-ios-simulator
          path: build/ios/iphonesimulator/news-app-ios-simulator.zip


  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android-release
      - ios-release

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: news-app-android-release
          path: artifacts/android

      - name: Download iOS Simulator App
        uses: actions/download-artifact@v4
        with:
          name: news-app-ios-simulator
          path: artifacts/ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android/app-release.apk
            artifacts/ios/news-app-ios-simulator.zip